name: devops-pipeline
on:
  push:
    branches: [main]

env:
  TF_VAR_docker_username: ${{ secrets.DOCKER_HUB_USERNAME }}
  TF_VAR_api_base_url: ${{ vars.BACKEND_URL }}

jobs:
  lint-and-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - uses: aquasecurity/tfsec-action@v1.0.3

  deploy-backend:
    needs: lint-and-sec
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, backend-server]
    steps:
      - uses: actions/checkout@v4
      - run: terraform init
      - run: terraform apply -auto-approve '-target=module.backend'

  deploy-frontend:
    needs: lint-and-sec
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, frontend-server]
    steps:
      - uses: actions/checkout@v4
      - run: terraform init
      - run: terraform apply -auto-approve '-target=module.frontend'