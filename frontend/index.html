<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f9;
            color: #222;
        }
        h1 { color: #263b63; }
        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled { opacity: .6; }
        #message { margin: 20px 0; }
        .event {
            background: white;
            padding: 18px;
            margin: 12px 0;
            border-radius: 8px;
            box-shadow: 0 2px 5px #ddd;
        }
    </style>
</head>
<body>
    <h1>Event Manager</h1>
    <p>Discover available events.</p>

    <button id="loadButton">Load Events</button>
    <div id="message"></div>
    <div id="events"></div>

    <script>
        const API_URL = "http://localhost:8002";

        const button = document.getElementById("loadButton");
        const message = document.getElementById("message");
        const eventsContainer = document.getElementById("events");

        button.addEventListener("click", loadEvents);

        async function loadEvents() {
            button.disabled = true;
            message.textContent = "Loading events...";
            eventsContainer.replaceChildren();

            try {
                const response = await fetch(`${API_URL}/events/`);

                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }

                const events = await response.json();

                if (!Array.isArray(events) || events.length === 0) {
                    message.textContent = "No events found.";
                    return;
                }

                message.textContent = `${events.length} event(s) found.`;

                events.forEach(event => {
                    const card = document.createElement("div");
                    card.className = "event";

                    const title = document.createElement("h2");
                    title.textContent = event.title;

                    const description = document.createElement("p");
                    description.textContent = event.description || "No description";

                    const date = document.createElement("p");
                    date.textContent = `Date: ${event.date}`;

                    const location = document.createElement("p");
                    location.textContent = `Location: ${event.location}`;

                    card.append(title, description, date, location);
                    eventsContainer.appendChild(card);
                });
            } catch (error) {
                message.textContent =
                    "Unable to load events. Check that the API is running and CORS is configured.";
                console.error(error);
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
